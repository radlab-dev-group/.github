# ---------------------------------------------------------------------------
# Documentation site configuration (tools/build_docs.py).
#
# Multi-repo layout:
#   Router  -- the version spine. Every release tag keeps a frozen copy of its
#              documentation at /docs/<version>/....
#   Plugins -- rolling docs (llm-router-plugins working tree) mounted into the
#              newest version at /docs/<latest>/plugins/....
#   Services-- rolling docs (llm-router-services working tree) mounted into the
#              newest version at /docs/<latest>/services/....
#
# Repository sources are configured in [[repos]] below. Paths can be supplied
# via CLI flags (--source, --plugins, --services), environment variables
# (LLM_ROUTER_DOCS_SOURCE, LLM_ROUTER_PLUGINS_DOCS_SOURCE,
# LLM_ROUTER_SERVICES_DOCS_SOURCE) or the path field in [[repos]]. Precedence:
# CLI > env > config > (primary only) this repo.
#
# Adding documentation: commit the .md file to the appropriate repo. Pages are
# grouped into [[sections]] (first matching glob wins); unmatched files go to
# that repo's fallback_section. Use [[pages]] to override title/output/order.
#
# Cross-repo links (for docs that moved) are declared in [[crosslinks]].
#
# Build commands:
#   python3 tools/build_docs.py --source /path/to/llm-router
#   python3 tools/build_docs.py --source /path/to/llm-router --plugins /path/to/plugins --services /path/to/services
#   python3 tools/build_docs.py --source /path/to/llm-router --all-versions
#   python3 tools/build_docs.py --source /path/to/llm-router --serve
# ---------------------------------------------------------------------------

[site]
title = "llm-router docs"
tagline = "Self-hosted AI gateway -- operator documentation"
description = "Documentation for llm-router: OpenAI-compatible gateway, PII masking, guardrails, load balancing, rate limiting, audit logs and Prometheus metrics."
repo_url = "https://github.com/radlab-dev-group/llm-router"
# Used to build canonical links; leave empty when the site is not published.
site_url = ""
# Shown as the "back to the landing page" target.
home_url = "../"

[discover]
include = ["**/*.md"]
exclude = [
  ".git/**",
  ".github/**",
  ".venv*/**",
  "venv/**",
  "site/**",
  "landing/**",
  "node_modules/**",
  "**/__pycache__/**",
  "**/node_modules/**",
  ".pytest_cache/**",
  "**/.pytest_cache/**",
  # Vendored model artifact directory, not tracked by git.
  "radlab/**",
  # Local ops scratch note with machine-specific paths.
  "scripts/MEDUSA_README.md",
]
fallback_section = "other"

# ---------------------------------------------------------------------------
# Repository sources
# ---------------------------------------------------------------------------

[[repos]]
id = "router"
name = "llm-router"
repo_url = "https://github.com/radlab-dev-group/llm-router"
primary = true
versions = "all"

[[repos]]
id = "plugins"
name = "llm-router-plugins"
repo_url = "https://github.com/radlab-dev-group/llm-router-plugins"
mount = "plugins"
versions = "latest"
fallback_section = "plugins-other"

[[repos]]
id = "services"
name = "llm-router-services"
repo_url = "https://github.com/radlab-dev-group/llm-router-services"
mount = "services"
versions = "latest"
fallback_section = "services-other"

# ---------------------------------------------------------------------------
# Navigation sections
# Evaluated per repository in order; the first matching glob wins.
# Sections of one repository must be contiguous.
# ---------------------------------------------------------------------------

[[sections]]
id = "getting-started"
title = "Getting started"
summary = "Install the gateway and get a first completion through the router."
match = ["README.md", "install.md", "llm_router_api/docs/INSTALLATION.md"]

[[sections]]
id = "configuration"
title = "Configuration"
summary = "Environment variables and the models.json routing configuration."
match = [
  "llm_router_api/docs/ENV_DEFINITIONS.md",
  "llm_router_api/docs/MODELS_CONFIG.md",
]

[[sections]]
id = "routing"
title = "Routing & resilience"
summary = "Load balancing strategies, failover and connection keep-alive."
match = [
  "llm_router_api/docs/LB_STRATEGIES.md",
  "llm_router_api/docs/KEEPALIVE.md",
]

[[sections]]
id = "security"
title = "Security & auditing"
summary = "Authentication, authorization, rate limiting and the GPG audit trail."
match = [
  "**/AUTHENTICATION.md",
  "**/RATE_LIMITING.md",
  "**/auditor/**",
]

[[sections]]
id = "observability"
title = "Observability"
summary = "Prometheus metrics exposed by the router and how to scrape them."
match = ["**/ROUTING_METRICS.md"]

[[sections]]
id = "rest-api"
title = "REST API"
summary = "Endpoint catalogue and the guide for adding your own endpoints."
match = [
  "llm_router_api/README.md",
  "llm_router_api/endpoints/**",
  "llm_router_api/docs/ENDPOINT_DEV.md",
  "llm_router_api/*.md",
]

[[sections]]
id = "cli"
title = "CLI"
summary = "llm-router command line reference: server lifecycle, models, utilities."
match = ["llm_router_cli/**"]

[[sections]]
id = "library"
title = "Python library"
summary = "Embed the router in your own code with llm_router_lib."
match = ["llm_router_lib/**"]

[[sections]]
id = "deployment"
title = "Deployment"
summary = "Helm chart, container image and the runtime knobs that matter in production."
match = ["helm_charts/**", "docker/**", "scripts/**"]

[[sections]]
id = "examples"
title = "Examples"
summary = "Runnable stacks: vLLM, Ollama, LangChain, LlamaIndex and client SDKs."
match = ["examples/**"]

# --- Satellite repo sections (plugins) ---

[[sections]]
id = "plugins-overview"
title = "Plugins overview"
summary = "The llm-router-plugins package: anonymizers, guardrails, semantic routing and RAG plugins."
repo = "plugins"
match = ["README.md"]

[[sections]]
id = "plugins-maskers"
title = "Masker plugins"
summary = "Built-in and custom PII anonymizer plugins."
repo = "plugins"
match = ["llm_router_plugins/maskers/**"]

[[sections]]
id = "plugins-routing"
title = "Routing plugins"
summary = "Semantic routing, bi-encoder routing and Codex CLI routing."
repo = "plugins"
match = ["llm_router_plugins/utils/routing/**"]

[[sections]]
id = "plugins-utils"
title = "Utility plugins"
summary = "RAG support and other pipeline utilities."
repo = "plugins"
match = ["llm_router_plugins/utils/**"]

[[sections]]
id = "plugins-scripts"
title = "Plugin scripts"
summary = "Shell scripts and operational guides for plugin tooling."
repo = "plugins"
match = ["scripts/**"]

[[sections]]
id = "plugins-other"
title = "Other plugins docs"
summary = "Plugin documentation without an explicit section."
repo = "plugins"
match = ["**/*.md"]

# --- Satellite repo sections (services) ---

[[sections]]
id = "services-overview"
title = "Services overview"
summary = "The llm-router-services HTTP API: guardrails, maskers and the unified Flask application."
repo = "services"
match = ["README.md"]

[[sections]]
id = "services-guardrails"
title = "Guardrail services"
summary = "NASK-PIB, Sojka and dynamic guardrail routing endpoints."
repo = "services"
match = ["llm_router_services/guardrails/**"]

[[sections]]
id = "services-maskers"
title = "Masker services"
summary = "The HTTP PII masker service and its caching model."
repo = "services"
match = ["llm_router_services/maskers/**"]

[[sections]]
id = "services-docker"
title = "Docker & deployment"
summary = "Building, running and deploying the services container."
repo = "services"
match = ["docker/**"]

[[sections]]
id = "services-other"
title = "Other services docs"
summary = "Services documentation without an explicit section."
repo = "services"
match = ["**/*.md"]

# --- Router sections continued (archived) ---

[[sections]]
id = "website"
title = "Website & tooling"
summary = "How this site, its builder and the Pages pipeline work -- for contributors."
match = ["tools/**"]

[[sections]]
id = "web-ui"
title = "Web UI (archived)"
summary = "Configuration and anonymizer panels shipped before the CLI rewrite."
match = ["llm_router_web/**"]

[[sections]]
id = "plugins-archived"
title = "Masker plugins (archived)"
summary = "Standalone masking plugins from the early 0.x releases."
match = ["llm_router_plugins/**"]

[[sections]]
id = "changelog"
title = "Release notes"
summary = "What changed in every released version."
match = ["CHANGELOG.md", "**/CHANGELOG.md"]

[[sections]]
id = "localized"
title = "Localized docs (archived)"
summary = "Translated documents kept for older releases."
match = ["**/*-pl.md", "**/*-en.md"]

[[sections]]
id = "other"
title = "Other docs"
summary = "Markdown files without an explicit section -- edit tools/docs.toml to regroup them."
match = ["**/*.md"]

# ---------------------------------------------------------------------------
# Per document overrides
# `path` is repo-relative. `repo` disambiguates when the same path exists in
# multiple repositories.
# ---------------------------------------------------------------------------

[[pages]]
path = "README.md"
title = "Overview"
out = "overview.html"
order = 10
summary = "What llm-router is: one OpenAI-compatible endpoint in front of every model you run, locally or in the cloud."

[[pages]]
path = "README.md"
repo = "plugins"
title = "Plugins overview"
out = "index.html"
order = 10

[[pages]]
path = "README.md"
repo = "services"
title = "llm-router services"
out = "index.html"
order = 10

[[pages]]
path = "llm_router_api/docs/INSTALLATION.md"
order = 20

[[pages]]
path = "CHANGELOG.md"
title = "Changelog"
out = "changelog.html"
adapter = "changelog"
order = 10

[[pages]]
path = "llm_router_api/docs/ENV_DEFINITIONS.md"
order = 10

[[pages]]
path = "llm_router_api/README.md"
title = "REST API reference"
order = 10

[[pages]]
path = "llm_router_api/endpoints/README.md"
order = 20

[[pages]]
path = "llm_router_cli/README.md"
order = 10

[[pages]]
path = "llm_router_lib/README.md"
order = 10

[[pages]]
path = "examples/README.md"
order = 10

[[pages]]
path = "tools/README.md"
title = "Documentation site"
out = "website.html"
order = 10
summary = "The generator behind /docs: discovery, per-release archives, search, theme and the Pages pipeline."

# ---------------------------------------------------------------------------
# Cross-repo link map
# Rewrites links from one repository to documentation that moved to another.
# `from` is optional (glob, default: any). `link` is exactly as written in the
# source doc (relative path or full GH URL). `to` = "<repo-id>:<path>[#anchor]".
# If the target page is not built for the current version, normal resolution
# (GH blob fallback) applies.
# ---------------------------------------------------------------------------

[[crosslinks]]
from = "README.md"
link = "llm_router_api/README.md#masking--guardrail"
to = "plugins:README.md#1-anonymizers-maskers"

