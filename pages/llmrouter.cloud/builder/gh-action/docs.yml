name: Docs

on:
  push:
    branches:
      - main
    paths:
      - 'builder/**'
      - 'landing/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'builder/**'
      - 'landing/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SOURCE_REPO: radlab-dev-group/llm-router
  PLUGINS_REPO: radlab-dev-group/llm-router-plugins
  SERVICES_REPO: radlab-dev-group/llm-router-services

jobs:
  build:
    name: Render versioned site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pages repository
        uses: actions/checkout@v4

      - name: Checkout router source (tags included)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          path: llm-router
          fetch-depth: 0

      - name: Checkout plugins source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PLUGINS_REPO }}
          path: llm-router-plugins
          fetch-depth: 1

      - name: Checkout services source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SERVICES_REPO }}
          path: llm-router-services
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: builder/tools/requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r builder/tools/requirements-docs.txt

      - name: Build /docs from the source repositories
        run: >-
          python builder/tools/build_docs.py
          --source llm-router
          --plugins llm-router-plugins
          --services llm-router-services
          --clean
          --all-versions
          --check-links
          --output site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
