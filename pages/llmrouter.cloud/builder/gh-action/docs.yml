name: Docs

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '**.md'
      - '.version'
      - 'tools/**'
      - 'landing/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**.md'
      - '.version'
      - 'tools/**'
      - 'landing/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Render versioned site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (tags included)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r tools/requirements-docs.txt

      - name: Build /docs for every release tag
        run: python tools/build_docs.py --all-versions --check-links --output site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
