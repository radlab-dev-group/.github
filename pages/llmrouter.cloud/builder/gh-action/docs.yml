name: Docs

on:
  push:
    branches:
      - main
    paths:
      - 'builder/**'
      - 'landing/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'builder/**'
      - 'landing/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Repository the documentation is generated from. It is checked out next to
# this one and passed to the builder as --source llm-router.
env:
  SOURCE_REPO: radlab-dev-group/llm-router

jobs:
  build:
    name: Render versioned site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pages repository
        uses: actions/checkout@v4

      - name: Checkout source repository (tags included)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          path: llm-router
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: builder/tools/requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r builder/tools/requirements-docs.txt

      - name: Build /docs from the source repository
        run: >-
          python builder/tools/build_docs.py
          --source llm-router
          --all-versions
          --check-links
          --output site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
